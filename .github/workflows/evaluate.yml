name: Evaluate classifier

# Re-classifies the evaluation samples with the current prompt, using the
# GEMINI_API_KEY secret, and commits eval/**/predictions_v<N>.csv.
on:
  workflow_dispatch:
    inputs:
      eval_dirs:
        description: "Space-separated sample directories"
        required: false
        default: "eval eval/test"

permissions:
  contents: write

concurrency:
  group: daily-radar # never commit at the same time as the daily run
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

      - name: Classify the samples with the current prompt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EVAL_DIRS: ${{ inputs.eval_dirs }}
        run: |
          for dir in $EVAL_DIRS; do
            python -m radar eval-classify --eval-dir "$dir"
          done

      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "eval: classify samples with the current prompt"
          git pull --rebase
          git push
