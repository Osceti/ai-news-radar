name: Daily radar

on:
  schedule:
    # 06:00 UTC: reports on the previous UTC day. Scheduled runs often start hours
    # late; any start time on the next day still produces the right digest.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC day to (re)build, YYYY-MM-DD (empty: yesterday)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Collect, classify and write the digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DIGEST_DATE: ${{ inputs.date }}
        run: python -m radar run ${DIGEST_DATE:+--date "$DIGEST_DATE"}

      - name: Commit data and digest
        env:
          DIGEST_DATE: ${{ inputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data digests
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "data: daily radar ${DIGEST_DATE:-$(date -u -d yesterday +%F)}"
          git pull --rebase
          git push
